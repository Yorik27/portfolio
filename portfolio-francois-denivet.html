<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>François Denivet — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:      #C9A84C;
  --gold-lt:   #E0BF72;
  --gold-pale: rgba(201,168,76,0.15);
  --gold-line: rgba(201,168,76,0.4);
  --bg:        #1A1208;
  --bg2:       #221808;
  --bg3:       #2C1F0A;
  --card:      #2E2008;
  --card-hov:  #382810;
  --border:    rgba(201,168,76,0.18);
  --border-md: rgba(201,168,76,0.38);
  --text1:     #F2E6C4;
  --text2:     #C8A85A;
  --text3:     #7A6030;
  --teal:      #4A9E94;
  --rust:      #B05030;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text1);
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg,   transparent, transparent 59px, rgba(201,168,76,0.06) 60px),
    repeating-linear-gradient(90deg,  transparent, transparent 59px, rgba(201,168,76,0.06) 60px),
    repeating-linear-gradient(45deg,  transparent, transparent 29px, rgba(201,168,76,0.025) 30px),
    repeating-linear-gradient(-45deg, transparent, transparent 29px, rgba(201,168,76,0.025) 30px);
  pointer-events: none; z-index: 0;
}

.page-wrap {
  position: relative; z-index: 1;
  max-width: 880px; margin: 0 auto;
  padding: 0 2rem 5rem;
}

.diamond { display: inline-block; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); }
.diamond.sm { width: 4px; height: 4px; }
.diamond.teal { background: var(--teal); }
.diamond.rust { background: var(--rust); }

.orn-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.orn-rule { flex: 1; max-width: 140px; height: 1px; background: linear-gradient(to right, transparent, var(--gold-line)); }
.orn-rule.rev { background: linear-gradient(to left, transparent, var(--gold-line)); }

/* HEADER */
header { text-align: center; padding: 4rem 0 2.5rem; }

.eyebrow {
  font-size: 10px; letter-spacing: 0.45em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 16px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(44px, 8vw, 72px);
  font-weight: 400; letter-spacing: 0.14em;
  color: var(--text1); line-height: 1;
  text-transform: uppercase;
}
h1 em { font-style: normal; color: var(--gold-lt); font-weight: 600; }

.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 18px;
  color: var(--text2); margin-top: 14px;
}

/* NAV */
nav {
  display: flex; justify-content: center;
  gap: 3rem; padding: 1.75rem 0 2.75rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 3rem;
}
nav a {
  font-size: 10px; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--text2);
  text-decoration: none; position: relative;
  transition: color 0.2s;
}
nav a::after {
  content: ''; position: absolute;
  bottom: -4px; left: 0; right: 0;
  height: 1px; background: var(--gold);
  transform: scaleX(0); transition: transform 0.25s;
}
nav a:hover { color: var(--gold); }
nav a:hover::after { transform: scaleX(1); }

/* SECTION HEADER */
.sec-head {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 2rem;
}
.sec-head::before { content: ''; width: 24px; height: 1px; background: var(--gold); }
.sec-head::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--gold-line), transparent); }
.sec-label {
  font-size: 9px; letter-spacing: 0.45em;
  text-transform: uppercase; color: var(--gold);
  white-space: nowrap;
}

section { margin-bottom: 4rem; }

/* APP CARDS */
.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.25rem;
}

.app-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 2px solid var(--gold);
  padding: 1.5rem; position: relative;
  transition: background 0.25s;
}
.app-card::before, .app-card::after {
  content: ''; position: absolute;
  width: 10px; height: 10px;
  border-color: var(--gold); border-style: solid; opacity: 0.3;
}
.app-card::before { bottom: 7px; right: 7px; border-width: 0 1px 1px 0; }
.app-card::after  { bottom: 7px; left:  7px; border-width: 0 0 1px 1px; }
.app-card:hover { background: var(--card-hov); }

.app-icon-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.app-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  background: var(--bg3); border: 1px solid var(--border-md);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.app-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 600; color: var(--text1);
}
.app-desc {
  font-size: 13px; line-height: 1.75;
  color: var(--text2); margin-bottom: 1.1rem;
}

.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1.1rem; }
.tag {
  font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; padding: 3px 9px;
  border: 1px solid var(--border-md); color: var(--gold);
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 10px; font-weight: 400; letter-spacing: 0.22em;
  text-transform: uppercase; padding: 6px 14px;
  text-decoration: none; background: transparent;
  cursor: pointer; border: 1px solid;
  transition: background 0.2s, border-color 0.2s;
}
.btn-gold  { color: var(--gold);  border-color: var(--gold-line); }
.btn-gold:hover  { background: var(--gold-pale); border-color: var(--gold); }
.btn-muted { color: var(--text3); border-color: var(--border); cursor: default; }

/* SONGS */
.songs-list { display: flex; flex-direction: column; }

.song-item {
  background: var(--card);
  border: 1px solid var(--border); border-bottom: none;
  overflow: hidden; transition: background 0.2s;
}
.song-item:first-child { border-top: 2px solid var(--gold); }
.song-item:last-child  { border-bottom: 1px solid var(--border); }
.song-item:hover       { background: var(--card-hov); }

.song-row {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  align-items: center; gap: 1rem;
  padding: 1rem 1.4rem;
  cursor: pointer; user-select: none;
}
.song-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; color: var(--gold);
  opacity: 0.45; text-align: right; line-height: 1;
}
.song-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px; font-weight: 600; color: var(--text1);
}
.song-sub {
  font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text3); margin-top: 3px;
}
.song-ctrls { display: flex; align-items: center; gap: 10px; }

.play-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  border: 1px solid var(--border-md); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s, border-color 0.2s;
}
.play-btn:hover, .play-btn.on { background: var(--gold-pale); border-color: var(--gold); }
.play-tri {
  width: 0; height: 0; border-style: solid;
  border-width: 6px 0 6px 10px;
  border-color: transparent transparent transparent var(--gold);
  margin-left: 2px;
}
.pause-bars { display: flex; gap: 3px; }
.pause-bar  { width: 3px; height: 12px; background: var(--gold); }

.lyrics-btn {
  font-size: 9px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--text3);
  background: transparent; border: none; cursor: pointer;
  transition: color 0.2s; white-space: nowrap;
}
.lyrics-btn:hover, .lyrics-btn.on { color: var(--gold); }
.lyr-arrow { display: inline-block; transition: transform 0.2s; margin-left: 3px; }
.lyrics-btn.on .lyr-arrow { transform: rotate(90deg); }

.audio-bar {
  display: none; align-items: center; gap: 10px;
  padding: 0 1.4rem 0.9rem;
}
.audio-bar.on { display: flex; }
.a-time { font-size: 11px; color: var(--text3); min-width: 34px; text-align: center; }
.prog-wrap { flex: 1; height: 2px; background: var(--bg3); cursor: pointer; position: relative; }
.prog-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.1s linear; pointer-events: none; }

.lyrics-panel {
  display: none; padding: 1.1rem 1.4rem 1.4rem;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}
.lyrics-panel.on { display: block; }
.lyrics-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 15px;
  line-height: 1.95; color: var(--text2);
  white-space: pre-line;
}

/* EDIT BUTTON */
#editToggle {
  position: fixed; bottom: 24px; right: 24px; z-index: 100;
  width: 44px; height: 44px;
  background: var(--bg3); border: 1px solid var(--border-md);
  color: var(--gold); font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
#editToggle:hover { background: var(--card); }

/* EDIT PANEL */
#editPanel {
  display: none; position: fixed;
  top: 0; right: 0;
  width: 420px; max-width: 95vw; height: 100vh;
  background: var(--bg2); border-left: 1px solid var(--border-md);
  z-index: 200; overflow-y: auto; flex-direction: column;
}
#editPanel.on { display: flex; }

.ep-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ep-title { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }
.ep-close { background: transparent; border: none; color: var(--text3); font-size: 22px; cursor: pointer; line-height: 1; }
.ep-close:hover { color: var(--text1); }

.ep-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ep-tab {
  flex: 1; padding: 10px;
  font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--text3); background: transparent; border: none;
  cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s;
}
.ep-tab.on { color: var(--gold); border-bottom-color: var(--gold); }

.ep-body { padding: 1.25rem 1.5rem; flex: 1; }

.field { margin-bottom: 1rem; }
.field label {
  display: block; font-size: 9px; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 5px;
}
.field input, .field textarea {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border); color: var(--text1);
  font-family: 'Josefin Sans', sans-serif; font-size: 13px;
  padding: 7px 10px; outline: none; transition: border-color 0.2s; resize: vertical;
}
.field input:focus, .field textarea:focus { border-color: var(--gold-line); }
.field textarea { min-height: 100px; line-height: 1.6; }

.ep-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1rem; }
.ep-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg3); border: 1px solid var(--border);
  padding: 8px 12px; cursor: pointer; transition: border-color 0.2s;
}
.ep-item:hover { border-color: var(--gold-line); }
.ep-item-name { font-size: 13px; color: var(--text1); }
.ep-item-del {
  background: transparent; border: none; color: var(--text3);
  font-size: 18px; cursor: pointer; line-height: 1;
}
.ep-item-del:hover { color: #c0392b; }

.ep-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 1rem; }
.ep-hint { font-size: 11px; color: var(--text3); margin-top: 1rem; line-height: 1.65; }

/* FOOTER */
footer {
  text-align: center; padding: 2.5rem 0 1rem;
  border-top: 1px solid var(--border); margin-top: 1rem;
}
.foot-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--text3);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fu { animation: fadeUp 0.55s ease both; }
.fu:nth-child(1) { animation-delay: 0.05s; }
.fu:nth-child(2) { animation-delay: 0.12s; }
.fu:nth-child(3) { animation-delay: 0.19s; }
.fu:nth-child(4) { animation-delay: 0.26s; }
.fu:nth-child(5) { animation-delay: 0.33s; }
.fu:nth-child(6) { animation-delay: 0.40s; }
</style>
</head>

let nextId = 200;
let epTab = 'apps';
let editingApp = null, editingSong = null;
let currentAudio = null;

/* ── RENDER APPS ── */
function renderApps() {
  const g = document.getElementById('appsGrid');
  g.innerHTML = '';
  APPS.forEach(a => {
    const el = document.createElement('div');
    el.className = 'app-card fu';
    const btn = a.url
      ? `<a href="${a.url}" target="_blank" class="btn btn-gold"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M7 1h4v4M11 1L6 6M2 3H1v8h8v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>${a.urlLabel}</a>`
      : `<button class="btn btn-muted"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 6l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Bientôt disponible</button>`;
    el.innerHTML = `
      <div class="app-icon-wrap"><div class="app-icon">${a.icon}</div><div class="app-name">${a.name}</div></div>
      <p class="app-desc">${a.desc}</p>
      <div class="tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div>${btn}</div>`;
    g.appendChild(el);
  });
}

/* ── RENDER SONGS ── */
function renderSongs() {
  const list = document.getElementById('songsList');
  list.innerHTML = '';
  SONGS.forEach((s, i) => {
    const hasL = s.lyrics && s.lyrics.trim().length > 0;
    const el = document.createElement('div');
    el.className = 'song-item fu';
    el.innerHTML = `
      <div class="song-row">
        <div class="song-num">${String(i+1).padStart(2,'0')}</div>
        <div>
          <div class="song-title">${s.title}</div>
          <div class="song-sub">Composition · Suno${hasL?' · Paroles':''}</div>
        </div>
        <div class="song-ctrls">
          ${hasL?`<button class="lyrics-btn" data-i="${i}">Paroles<span class="lyr-arrow">›</span></button>`:''}
          <button class="play-btn" data-i="${i}"><span class="play-tri"></span></button>
        </div>
      </div>
      <div class="audio-bar" id="ab-${i}">
        <span class="a-time" id="ac-${i}">0:00</span>
        <div class="prog-wrap" id="ap-${i}"><div class="prog-fill" id="af-${i}"></div></div>
        <span class="a-time" id="ad-${i}">0:00</span>
      </div>
      ${hasL?`<div class="lyrics-panel" id="al-${i}"><div class="lyrics-text">${s.lyrics.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div></div>`:''}`;
    list.appendChild(el);
  });
  document.querySelectorAll('.play-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); togglePlay(parseInt(b.dataset.i), b); }));
  document.querySelectorAll('.lyrics-btn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const i = b.dataset.i;
    const p = document.getElementById('al-'+i);
    if (p) { p.classList.toggle('on'); b.classList.toggle('on'); }
  }));
  document.querySelectorAll('.prog-wrap').forEach(pw => pw.addEventListener('click', e => {
    const i = parseInt(pw.id.replace('ap-',''));
    if (currentAudio && parseInt(currentAudio.dataset.i) === i) {
      const r = pw.getBoundingClientRect();
      currentAudio.currentTime = ((e.clientX-r.left)/r.width)*currentAudio.duration;
    }
  }));
}

function fmt(s) { if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

function togglePlay(i, btn) {
  const bar = document.getElementById('ab-'+i);
  if (currentAudio && parseInt(currentAudio.dataset.i) === i) {
    if (currentAudio.paused) { currentAudio.play(); setPl(btn,true); }
    else { currentAudio.pause(); setPl(btn,false); }
    return;
  }
  if (currentAudio) {
    currentAudio.pause();
    const pi = currentAudio.dataset.i;
    const pb = document.querySelector(`.play-btn[data-i="${pi}"]`);
    if (pb) setPl(pb,false);
    const pb2 = document.getElementById('ab-'+pi);
    if (pb2) pb2.classList.remove('on');
  }
  const audio = new Audio(SONGS[i].file);
  audio.dataset.i = i; currentAudio = audio;
  bar.classList.add('on');
  audio.addEventListener('loadedmetadata', () => { const d=document.getElementById('ad-'+i); if(d) d.textContent=fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    const c=document.getElementById('ac-'+i), f=document.getElementById('af-'+i);
    if(c) c.textContent=fmt(audio.currentTime);
    if(f&&audio.duration) f.style.width=(audio.currentTime/audio.duration*100)+'%';
  });
  audio.addEventListener('ended', () => { setPl(btn,false); bar.classList.remove('on'); const f=document.getElementById('af-'+i); if(f) f.style.width='0%'; });
  audio.play().then(()=>setPl(btn,true)).catch(()=>{});
}

function setPl(btn, on) {
  btn.classList.toggle('on', on);
  btn.innerHTML = on ? '<span class="pause-bars"><span class="pause-bar"></span><span class="pause-bar"></span></span>' : '<span class="play-tri"></span>';
}

/* ── EDIT PANEL ── */
document.getElementById('editToggle').addEventListener('click', () => { document.getElementById('editPanel').classList.toggle('on'); renderEP(); });
document.getElementById('epClose').addEventListener('click', () => document.getElementById('editPanel').classList.remove('on'));
document.querySelectorAll('.ep-tab').forEach(t => t.addEventListener('click', () => {
  epTab = t.dataset.tab; editingApp = editingSong = null;
  document.querySelectorAll('.ep-tab').forEach(x => x.classList.remove('on')); t.classList.add('on');
  renderEP();
}));

function renderEP() {
  const b = document.getElementById('epBody');
  epTab === 'apps' ? renderEPApps(b) : renderEPSongs(b);
}

function renderEPApps(b) {
  if (editingApp !== null) {
    const a = editingApp === 'new' ? {id:null,icon:'📱',name:'',desc:'',tags:'',url:'',urlLabel:'Voir'} : APPS.find(x=>x.id===editingApp)||{};
    b.innerHTML = `
      <div class="field"><label>Icône (emoji)</label><input id="eaI" value="${a.icon||''}"></div>
      <div class="field"><label>Nom</label><input id="eaN" value="${a.name||''}"></div>
      <div class="field"><label>Description</label><textarea id="eaD">${a.desc||''}</textarea></div>
      <div class="field"><label>Tags (séparés par des virgules)</label><input id="eaT" value="${Array.isArray(a.tags)?a.tags.join(', '):a.tags||''}"></div>
      <div class="field"><label>Lien URL</label><input id="eaU" value="${a.url||''}" placeholder="https://..."></div>
      <div class="field"><label>Libellé du bouton</label><input id="eaL" value="${a.urlLabel||'Voir'}"></div>
      <div class="ep-actions">
        <button class="btn btn-gold" id="eaSv">Enregistrer</button>
        <button class="btn btn-muted" id="eaCx">Annuler</button>
      </div>`;
    document.getElementById('eaSv').addEventListener('click', () => {
      const d = { id:a.id||nextId++, icon:document.getElementById('eaI').value, name:document.getElementById('eaN').value,
        desc:document.getElementById('eaD').value, tags:document.getElementById('eaT').value.split(',').map(s=>s.trim()).filter(Boolean),
        url:document.getElementById('eaU').value, urlLabel:document.getElementById('eaL').value||'Voir' };
      if (editingApp==='new') APPS.push(d); else { const idx=APPS.findIndex(x=>x.id===editingApp); if(idx>=0) APPS[idx]=d; }
      editingApp=null; renderApps(); renderEP();
    });
    document.getElementById('eaCx').addEventListener('click', () => { editingApp=null; renderEP(); });
    return;
  }
  b.innerHTML = `
    <div class="ep-list">${APPS.map(a=>`<div class="ep-item" data-id="${a.id}"><span class="ep-item-name">${a.icon} ${a.name}</span><button class="ep-item-del" data-del="${a.id}">×</button></div>`).join('')}</div>
    <div class="ep-actions"><button class="btn btn-gold" id="eaNew">+ Ajouter</button></div>
    <p class="ep-hint">Pour les APK : hébergez sur GitHub Releases et collez ici le lien de téléchargement direct.</p>`;
  b.querySelectorAll('.ep-item').forEach(el => el.addEventListener('click', e => { if(e.target.closest('[data-del]')) return; editingApp=parseInt(el.dataset.id); renderEP(); }));
  b.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); APPS=APPS.filter(a=>a.id!==parseInt(btn.dataset.del)); renderApps(); renderEP(); }));
  document.getElementById('eaNew').addEventListener('click', () => { editingApp='new'; renderEP(); });
}

function renderEPSongs(b) {
  if (editingSong !== null) {
    const s = editingSong === 'new' ? {id:null,title:'',file:'',lyrics:''} : SONGS.find(x=>x.id===editingSong)||{};
    b.innerHTML = `
      <div class="field"><label>Titre</label><input id="esT" value="${s.title||''}"></div>
      <div class="field"><label>Fichier MP3 (nom exact)</label><input id="esF" value="${s.file||''}" placeholder="Ma_chanson.mp3"></div>
      <div class="field"><label>Paroles</label><textarea id="esL" style="min-height:220px;">${s.lyrics||''}</textarea></div>
      <div class="ep-actions">
        <button class="btn btn-gold" id="esSv">Enregistrer</button>
        <button class="btn btn-muted" id="esCx">Annuler</button>
      </div>`;
    document.getElementById('esSv').addEventListener('click', () => {
      const d = { id:s.id||nextId++, title:document.getElementById('esT').value, file:document.getElementById('esF').value, lyrics:document.getElementById('esL').value };
      if (editingSong==='new') SONGS.push(d); else { const idx=SONGS.findIndex(x=>x.id===editingSong); if(idx>=0) SONGS[idx]=d; }
      editingSong=null; if(currentAudio){currentAudio.pause();currentAudio=null;} renderSongs(); renderEP();
    });
    document.getElementById('esCx').addEventListener('click', () => { editingSong=null; renderEP(); });
    return;
  }
  b.innerHTML = `
    <div class="ep-list">${SONGS.map(s=>`<div class="ep-item" data-id="${s.id}"><span class="ep-item-name">${s.title}</span><button class="ep-item-del" data-del="${s.id}">×</button></div>`).join('')}</div>
    <div class="ep-actions"><button class="btn btn-gold" id="esNew">+ Ajouter</button></div>
    <p class="ep-hint">Place le fichier MP3 dans le même dossier que ce fichier HTML, avec exactement le même nom de fichier.</p>`;
  b.querySelectorAll('.ep-item').forEach(el => el.addEventListener('click', e => { if(e.target.closest('[data-del]')) return; editingSong=parseInt(el.dataset.id); renderEP(); }));
  b.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); SONGS=SONGS.filter(s=>s.id!==parseInt(btn.dataset.del)); if(currentAudio){currentAudio.pause();currentAudio=null;} renderSongs(); renderEP(); }));
  document.getElementById('esNew').addEventListener('click', () => { editingSong='new'; renderEP(); });
}

renderApps();
renderSongs();
</script>
</body>
